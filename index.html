<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Swift Vocabulary Wordle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        wordle: {
                            green: '#538d4e',
                            yellow: '#b59f3b',
                            darkgray: '#3a3a3c',
                            lightgray: '#818384',
                            absent: '#787c7e',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        @keyframes flip {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }
        .animate-flip {
            animation: flip 0.6s ease forwards;
        }
        @keyframes bounce-custom {
            0%, 20% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            50% { transform: translateY(5px); }
            60% { transform: translateY(-15px); }
            80% { transform: translateY(2px); }
            100% { transform: translateY(0); }
        }
        .animate-bounce-custom {
            animation: bounce-custom 0.5s ease;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .animate-shake {
            animation: shake 0.4s ease;
        }
        /* Style for blurred/redacted secret word in hint examples */
        .blurred-word {
            filter: blur(4px);
            user-select: none;
            background-color: rgba(156, 163, 175, 0.3);
            padding: 0 4px;
            border-radius: 4px;
            display: inline-block;
            transition: filter 0.3s;
        }
        .blurred-word:hover {
            filter: blur(0px);
        }
    </style>
</head>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">

                <button id="close-settings" class="p-1 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-full">

            </div>
            
            <div class="space-y-4 flex-1 overflow-y-auto pr-1">

                        <option value="4">4 Letters</option>
                        <option value="5" selected>5 Letters</option>
                        <option value="6">6 Letters</option>
                        <option value="7">7 Letters</option>
                        <option value="8">8 Letters</option>
                        <option value="9">9+ Letters</option>
                    </select>
                </div>

                <div class="bg-zinc-100 dark:bg-zinc-800/50 p-3 rounded-xl text-xs space-y-1">
                    <div id="word-stats" class="font-semibold">Loaded SAT Vocabulary Words: 0</div>
                    <div id="word-list-preview" class="text-zinc-500 truncate">Ready to play.</div>
                </div>

                <div class="flex space-x-2 pt-2">
                    <button id="reset-bank-btn" class="flex-1 bg-zinc-200 dark:bg-zinc-800 hover:bg-zinc-300 dark:hover:bg-zinc-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition">Reset Full Vocab Bank</button>

                </div>
            </div>

    </div>

    <!-- Game Over & Word Learning Review Modal (Shown on both win & loss) -->
    <div id="game-over-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl flex flex-col items-center text-center space-y-4">
            <h2 id="game-over-title" class="text-2xl font-black">Brilliant! 🎉</h2>
            
            <p id="game-over-message" class="text-xs text-zinc-500 dark:text-zinc-400">
                The target SAT vocabulary word was:
            </p>
            <div id="secret-word-display" class="font-black text-2xl uppercase tracking-widest text-green-600 dark:text-green-400 -mt-2"></div>

            <div id="definition-box" class="bg-zinc-100 dark:bg-zinc-800/60 p-3.5 rounded-xl text-xs text-left w-full space-y-2 border border-zinc-200/50 dark:border-zinc-700/50">

                    <span class="font-bold text-zinc-800 dark:text-zinc-200 block text-[11px] uppercase tracking-wider text-green-600 dark:text-green-400">Meaning</span>
                    <span id="vocab-meaning" class="text-zinc-700 dark:text-zinc-300 font-medium"></span>
                </div>
                <div>
                    <span class="font-bold text-zinc-800 dark:text-zinc-200 block text-[11px] uppercase tracking-wider text-amber-600 dark:text-amber-400">Example</span>
                    <span id="vocab-example" class="text-zinc-700 dark:text-zinc-300 italic"></span>
                </div>

                    <span class="font-bold text-zinc-800 dark:text-zinc-200 block text-[11px] uppercase tracking-wider text-indigo-600 dark:text-indigo-400">3 Common Synonyms</span>

            <div class="grid grid-cols-2 gap-3 w-full py-1">
                <div class="bg-zinc-100 dark:bg-zinc-800 p-2.5 rounded-xl">
                    <div id="stat-played" class="text-lg font-bold">0</div>
                    <div class="text-[9px] text-zinc-500 uppercase tracking-wider">Played</div>
                </div>
                <div class="bg-zinc-100 dark:bg-zinc-800 p-2.5 rounded-xl">
                    <div id="stat-win" class="text-lg font-bold">0%</div>
                    <div class="text-[9px] text-zinc-500 uppercase tracking-wider">Win Rate</div>
                </div>
            </div>

            <div class="flex space-x-2 w-full pt-1">
                <button id="play-again-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-green-600/20 flex items-center justify-center space-x-2">
                    <span>Next SAT Word</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // SAT Vocabulary Dataset (Word, Meaning, Example, Synonyms)
        const SAT_VOCAB_RAW = [
            { word: "COINCIDENCE", meaning: "two things happening together by chance", example: "Meeting her there was a pure coincidence.", synonyms: ["accident", "fluke", "chance"] },
            { word: "CONTENTIOUS", meaning: "causing disagreement, sparks contests/arguments", example: "Immigration is a contentious political topic.", synonyms: ["disputable", "quarrelsome", "controversial"] },
            { word: "CORDIALLY", meaning: "in a warm, friendly manner", example: "You are cordially invited to the wedding.", synonyms: ["warmly", "genially", "graciously"] },
            { word: "DISCERNIBLE", meaning: "able to be perceived or recognized", example: "The change was barely discernible to the naked eye.", synonyms: ["noticeable", "perceptible", "apparent"] },
            { word: "DISCONCERTING", meaning: "unsettling, confusing, throws off harmony", example: "It was disconcerting to see the empty building.", synonyms: ["disturbing", "unsettling", "disquieting"] },
            { word: "HAPHAZARD", meaning: "left to chance and risk; lacking order", example: "The files were stored in a haphazard manner.", synonyms: ["random", "disorganized", "careless"] },
            { word: "PRUDENTLY", meaning: "done with care and good judgment", example: "She prudently invested her savings.", synonyms: ["wisely", "cautiously", "sensibly"] },
            { word: "REPRIEVE", meaning: "a temporary delay or relief from something bad", example: "The rain gave farmers a brief reprieve from the drought.", synonyms: ["respite", "postponement", "pardon"] },
            { word: "SUBSTANTIAL", meaning: "large in size or amount; solid", example: "They made substantial progress on the project.", synonyms: ["considerable", "significant", "sizeable"] },
            { word: "SUPERFICIAL", meaning: "only on the surface, not deep", example: "His analysis was superficial and lacked depth.", synonyms: ["shallow", "surface-level", "cursory"] },
            { word: "ABRUPT", meaning: "sudden and unexpected", example: "His abrupt exit surprised everyone at the meeting.", synonyms: ["sudden", "hasty", "brusque"] },
            { word: "ACKNOWLEDGED", meaning: "admitted or recognized as true", example: "He acknowledged his mistake in front of the class.", synonyms: ["admitted", "recognized", "accepted"] },
            { word: "ADHERE", meaning: "stick to; follow strictly", example: "All employees must adhere to the safety guidelines.", synonyms: ["comply", "stick", "cleave"] },
            { word: "ADMIRED", meaning: "respected greatly", example: "The teacher was admired by all her students.", synonyms: ["esteemed", "revered", "respected"] },
            { word: "ADORN", meaning: "decorate or add beauty to", example: "The walls were adorned with colorful paintings.", synonyms: ["decorate", "embellish", "ornament"] },
            { word: "ADVANTAGEOUS", meaning: "beneficial, full of advantage", example: "A good location is advantageous for any business.", synonyms: ["beneficial", "favorable", "profitable"] },
            { word: "AFFINITY", meaning: "a natural liking or attraction for something", example: "He has a strong affinity for classical music.", synonyms: ["fondness", "rapport", "inclination"] },
            { word: "AGGRAVATE", meaning: "make worse; irritate", example: "Scratching will only aggravate the rash.", synonyms: ["exasperate", "worsen", "intense"] },
            { word: "AMBIGUITY", meaning: "unclear meaning, open to interpretation", example: "The contract's ambiguity led to a lawsuit.", synonyms: ["uncertainty", "obscurity", "vagueness"] },
            { word: "AMBIGUOUS", meaning: "open to more than one meaning", example: "His ambiguous answer left us more confused.", synonyms: ["unclear", "equivocal", "vague"] },
            { word: "AMBIVALENCE", meaning: "mixed feelings, feeling both ways", example: "Her ambivalence about the job offer kept her up at night.", synonyms: ["indecision", "doubt", "hesitation"] },

        // Clean and prepare dictionary (filter out invalid symbols)
        const CLEANED_VOCAB = SAT_VOCAB_RAW
            .map(item => ({ 
                ...item, 
                word: item.word.replace(/[^A-Z]/g, ''),
                synonyms: item.synonyms || ["similar term", "parallel", "equivalent"]
            }))
            .filter(item => item.word.length >= 3 && item.word.length <= 10);

        // Game Configuration State
        let config = {
            wordLength: 5,
            maxGuesses: 6
        };

        // Active Game State
        let gameState = {
            secretWord: "",
            currentEntry: null, // Vocab object
            guesses: [],
            currentGuess: "",
            gameOver: false,
            stats: { played: 0, wins: 0 }
        };

        // DOM Elements
        const boardContainer = document.getElementById('board-container');
        const keyboardContainer = document.getElementById('keyboard-container');
        const settingsModal = document.getElementById('settings-modal');
        const gameOverModal = document.getElementById('game-over-modal');
        const wordLengthSelect = document.getElementById('word-length-select');
        const wordStats = document.getElementById('word-stats');
        const wordListPreview = document.getElementById('word-list-preview');
        const hintBtn = document.getElementById('hint-btn');
        const hintBanner = document.getElementById('hint-banner');
        const hintText = document.getElementById('hint-text');

        // Helper: Mask / Blur secret word variations inside example sentences
        function maskSecretWord(sentence, targetWord) {
            if (!sentence || !targetWord) return "";
            // Match word root variations (e.g. word + s, ed, ing, ly, etc.)
            const root = targetWord.slice(0, Math.max(3, targetWord.length - 2));
            const regex = new RegExp(`\\b${root}[a-zA-Z]*\\b`, 'gi');
            
            return sentence.replace(regex, (match) => {
                return `<span class="blurred-word" title="Click or hover to reveal">${match}</span>`;
            });
        }

        // Initialize App on Load
        window.onload = function() {
            loadFromStorage();
            setupEventListeners();
            initGame();
        };

        // Load stats from localStorage
        function loadFromStorage() {
            const savedStats = localStorage.getItem('sat_wordle_stats');
            if (savedStats) {
                try {
                    gameState.stats = JSON.parse(savedStats);
                } catch(e) {}
            }
            const savedLen = localStorage.getItem('sat_wordle_len');
            if (savedLen) {
                config.wordLength = parseInt(savedLen);
                wordLengthSelect.value = config.wordLength;
            }
            updateWordStats();
        }

        // Save stats to localStorage
        function saveToStorage() {
            localStorage.setItem('sat_wordle_stats', JSON.stringify(gameState.stats));
            localStorage.setItem('sat_wordle_len', config.wordLength);
        }

        function updateWordStats() {
            const matching = CLEANED_VOCAB.filter(i => {
                if (config.wordLength >= 8) {
                    return i.word.length >= 8;
                }
                return i.word.length === config.wordLength;
            });
            wordStats.textContent = `SAT Vocab words available (${config.wordLength >= 8 ? '8+' : config.wordLength}-letter): ${matching.length}`;
            wordListPreview.textContent = matching.map(i => i.word).slice(0, 10).join(', ') + (matching.length > 10 ? '...' : '');
            const wordLengthIndicator = document.getElementById('word-length-indicator');
            if (wordLengthIndicator) {
                wordLengthIndicator.textContent = `Length: ${config.wordLength >= 8 ? '8+' : config.wordLength}`;
            }
        }

        // Initialize a new game round
        function initGame() {
            const matching = CLEANED_VOCAB.filter(i => {
                if (config.wordLength >= 8) {
                    return i.word.length >= 8;
                }
                return i.word.length === config.wordLength;
            });
            if (matching.length === 0) {
                showToast(`No words found for length ${config.wordLength}. Defaulting to 5!`);
                config.wordLength = 5;
                wordLengthSelect.value = "5";
                initGame();
                return;
            }

            // Pick random secret word
            const randomIndex = Math.floor(Math.random() * matching.length);
            gameState.currentEntry = matching[randomIndex];
            gameState.secretWord = gameState.currentEntry.word;
            
            config.wordLength = gameState.secretWord.length;

            gameState.guesses = [];
            gameState.currentGuess = "";
            gameState.gameOver = false;

            const wordLengthIndicator = document.getElementById('word-length-indicator');
            if (wordLengthIndicator) {
                wordLengthIndicator.textContent = `Length: ${config.wordLength} (${matching.length} SAT Words)`;
            }
            hintBanner.classList.add('hidden');
            
            buildBoard();
            resetKeyboardUI();
        }

        // Build grid board dynamically
        function buildBoard() {
            boardContainer.innerHTML = '';
            boardContainer.style.gridTemplateColumns = `repeat(${config.wordLength}, minmax(0, 1fr))`;
            
            for (let r = 0; r < config.maxGuesses; r++) {
                for (let c = 0; c < config.wordLength; c++) {
                    const tile = document.createElement('div');
                    tile.id = `tile-${r}-${c}`;
                    tile.className = `w-11 h-11 sm:w-13 sm:h-13 border-2 border-zinc-300 dark:border-zinc-700 font-black text-xl sm:text-2xl flex items-center justify-center rounded-lg uppercase transition-all duration-300 select-none bg-white dark:bg-[#121213]`;
                    boardContainer.appendChild(tile);
                }
            }
        }

        function setupEventListeners() {
            // Virtual Keyboard clicks
            keyboardContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('button');
                if (!btn) return;
                const key = btn.getAttribute('data-key');
                if (key) handleKeyInput(key);
            });

            // Physical Keyboard input
            window.addEventListener('keydown', (e) => {
                if (settingsModal.classList.contains('hidden') === false || gameOverModal.classList.contains('hidden') === false) {
                    if (e.key === 'Escape') {
                        settingsModal.classList.add('hidden');
                        gameOverModal.classList.add('hidden');
                    }
                    return;
                }

                if (e.key === 'Enter') {
                    handleKeyInput('ENTER');
                } else if (e.key === 'Backspace') {
                    handleKeyInput('BACKSPACE');
                } else {
                    const upper = e.key.toUpperCase();
                    if (/^[A-Z]$/.test(upper)) {
                        handleKeyInput(upper);
                    }
                }
            });

            // Modals & Controls
            document.getElementById('settings-btn').addEventListener('click', () => {
                updateWordStats();
                settingsModal.classList.remove('hidden');
            });
            document.getElementById('close-settings').addEventListener('click', () => settingsModal.classList.add('hidden'));
            document.getElementById('save-settings-btn').addEventListener('click', () => {
                config.wordLength = parseInt(wordLengthSelect.value) || 5;
                settingsModal.classList.add('hidden');
                saveToStorage();
                initGame();
                showToast(`Switched to ${config.wordLength}-letter SAT words!`);
            });
            document.getElementById('reset-bank-btn').addEventListener('click', () => {
                config.wordLength = 5;
                wordLengthSelect.value = "5";
                updateWordStats();
                showToast("Reset to default 5-letter SAT bank.");
            });

            document.getElementById('play-again-btn').addEventListener('click', () => {
                gameOverModal.classList.add('hidden');
                initGame();
            });

            // Theme Toggle
            document.getElementById('theme-toggle').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Hint Button Click handler (with blurred word mask and synonyms)
            hintBtn.addEventListener('click', () => {
                if (gameState.gameOver) return;
                
                const maskedExample = maskSecretWord(gameState.currentEntry.example, gameState.secretWord);
                const synonymList = (gameState.currentEntry.synonyms || []).slice(0, 3).join(', ');

                hintText.innerHTML = `
                    <div><strong>Meaning:</strong> ${gameState.currentEntry.meaning}</div>
                    <div><strong>Example:</strong> "${maskedExample}"</div>
                    <div><strong>Synonyms:</strong> <span class="font-semibold text-amber-700 dark:text-amber-300">${synonymList}</span></div>
                `;
                hintBanner.classList.remove('hidden');
            });
            
            document.getElementById('close-hint').addEventListener('click', () => hintBanner.classList.add('hidden'));
        }

        function handleKeyInput(key) {
            if (gameState.gameOver) return;

            if (key === 'BACKSPACE') {
                if (gameState.currentGuess.length > 0) {
                    gameState.currentGuess = gameState.currentGuess.slice(0, -1);
                    updateBoardUI();
                }
            } else if (key === 'ENTER') {
                if (gameState.currentGuess.length !== config.wordLength) {
                    showToast(`Not enough letters! Word must be ${config.wordLength} letters.`);
                    shakeCurrentRow();
                    return;
                }
                submitGuess();
            } else {
                if (gameState.currentGuess.length < config.wordLength) {
                    gameState.currentGuess += key;
                    updateBoardUI();
                }
            }
        }

        function updateBoardUI() {
            const currentRow = gameState.guesses.length;
            for (let c = 0; c < config.wordLength; c++) {
                const tile = document.getElementById(`tile-${currentRow}-${c}`);
                if (c < gameState.currentGuess.length) {
                    tile.textContent = gameState.currentGuess[c];
                    tile.classList.add('border-zinc-500', 'scale-105');
                    setTimeout(() => tile.classList.remove('scale-105'), 100);
                } else {
                    tile.textContent = '';
                    tile.classList.remove('border-zinc-500');
                }
            }
        }

        function submitGuess() {
            const guess = gameState.currentGuess;
            const currentRow = gameState.guesses.length;

            const secretArr = gameState.secretWord.split('');
            const guessArr = guess.split('');
            const statuses = Array(config.wordLength).fill('absent');

            // 1. Check Greens
            for (let i = 0; i < config.wordLength; i++) {
                if (guessArr[i] === secretArr[i]) {
                    statuses[i] = 'correct';
                    secretArr[i] = null;
                    guessArr[i] = null;
                }
            }

            // 2. Check Yellows
            for (let i = 0; i < config.wordLength; i++) {
                if (guessArr[i] !== null) {
                    const secretIdx = secretArr.indexOf(guessArr[i]);
                    if (secretIdx !== -1) {
                        statuses[i] = 'present';
                        secretArr[secretIdx] = null;
                    }
                }
            }

            animateTileColors(currentRow, guess, statuses);

            gameState.guesses.push(guess);
            gameState.currentGuess = "";

            // Check Game Outcome
            setTimeout(() => {
                if (guess === gameState.secretWord) {
                    endGame(true);
                } else if (gameState.guesses.length >= config.maxGuesses) {
                    endGame(false);
                }
            }, config.wordLength * 300 + 100);
        }

        function animateTileColors(row, guess, statuses) {
            for (let c = 0; c < config.wordLength; c++) {
                const tile = document.getElementById(`tile-${row}-${c}`);
                const letter = guess[c];
                const status = statuses[c];

                setTimeout(() => {
                    tile.classList.add('animate-flip');
                    setTimeout(() => {
                        if (status === 'correct') {
                            tile.classList.add('bg-wordle-green', 'text-white', 'border-wordle-green');
                            updateKeyboardButton(letter, 'correct');
                        } else if (status === 'present') {
                            tile.classList.add('bg-wordle-yellow', 'text-white', 'border-wordle-yellow');
                            updateKeyboardButton(letter, 'present');
                        } else {
                            tile.classList.add('bg-wordle-absent', 'text-white', 'border-wordle-absent');
                            updateKeyboardButton(letter, 'absent');
                        }
                    }, 300);
                }, c * 250);
            }
        }

        function updateKeyboardButton(letter, status) {
            const btn = keyboardContainer.querySelector(`[data-key="${letter}"]`);
            if (!btn) return;

            const currentClass = btn.className;
            if (currentClass.includes('bg-wordle-green')) return; // Priority rule
            if (status === 'correct') {
                btn.className = btn.className.replace(/bg-zinc-200|dark:bg-zinc-700|bg-wordle-yellow|bg-wordle-absent/g, '') + ' bg-wordle-green text-white';
            } else if (status === 'present' && !currentClass.includes('bg-wordle-green')) {
                btn.className = btn.className.replace(/bg-zinc-200|dark:bg-zinc-700|bg-wordle-absent/g, '') + ' bg-wordle-yellow text-white';
            } else if (status === 'absent' && !currentClass.includes('bg-wordle-green') && !currentClass.includes('bg-wordle-yellow')) {
                btn.className = btn.className.replace(/bg-zinc-200|dark:bg-zinc-700/g, '') + ' bg-wordle-absent text-white';
            }
        }

        function resetKeyboardUI() {
            const buttons = keyboardContainer.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.className = btn.className.replace(/bg-wordle-green|bg-wordle-yellow|bg-wordle-absent|text-white/g, '') + ' bg-zinc-200 dark:bg-zinc-700 hover:bg-zinc-300 dark:hover:bg-zinc-600';
            });
        }

        function shakeCurrentRow() {
            const currentRow = gameState.guesses.length;
            for (let c = 0; c < config.wordLength; c++) {
                const tile = document.getElementById(`tile-${currentRow}-${c}`);
                tile.classList.add('animate-shake');
                setTimeout(() => tile.classList.remove('animate-shake'), 400);
            }
        }

        // End Game logic - Shows detailed review screen on both wins & losses
        function endGame(won) {
            gameState.gameOver = true;
            gameState.stats.played++;
            if (won) gameState.stats.wins++;
            saveToStorage();

            const titleEl = document.getElementById('game-over-title');
            titleEl.textContent = won ? "Brilliant! 🎉" : "Word Missed! 📚";
            titleEl.className = won ? "text-2xl font-black text-green-600 dark:text-green-400" : "text-2xl font-black text-red-500 dark:text-red-400";

            document.getElementById('secret-word-display').textContent = gameState.secretWord;
            document.getElementById('vocab-meaning').textContent = gameState.currentEntry.meaning;
            
            // Full unblurred example on review screen
            document.getElementById('vocab-example').textContent = `"${gameState.currentEntry.example}"`;

            // Display 3 Synonyms
            const synonymsContainer = document.getElementById('vocab-synonyms');
            synonymsContainer.innerHTML = '';
            const synonyms = gameState.currentEntry.synonyms || ["similar", "equivalent", "matching"];
            synonyms.slice(0, 3).forEach(syn => {
                const badge = document.createElement('span');
                badge.className = 'px-2 py-0.5 bg-indigo-100 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 rounded-md font-semibold text-[11px] capitalize border border-indigo-200 dark:border-indigo-800';
                badge.textContent = syn;
                synonymsContainer.appendChild(badge);
            });
            
            // Stats
            document.getElementById('stat-played').textContent = gameState.stats.played;
            const winPct = Math.round((gameState.stats.wins / gameState.stats.played) * 100);
            document.getElementById('stat-win').textContent = `${winPct}%`;

            setTimeout(() => {
                gameOverModal.classList.remove('hidden');
            }, 600);
        }

        function showToast(message) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 px-4 py-2.5 rounded-xl text-xs font-bold shadow-xl transition-all duration-300 transform opacity-0 translate-y-2';
            toast.textContent = message;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('opacity-0', 'translate-y-2');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
